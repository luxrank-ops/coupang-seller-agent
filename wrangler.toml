name = "coupang-seller-agent"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[vars]
DEFAULT_TARGET_MARGIN = "0.30"
DEFAULT_COUPANG_FEE = "0.108"
LLM_PROVIDER = "gemini"

# Optional server-side credentials (never put them in this file):
# npx wrangler secret put DOMEGGOOK_API_KEY
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put OPENAI_API_KEY
