name = "coupang-seller-agent"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[vars]
DEFAULT_TARGET_MARGIN = "0.30"
DEFAULT_COUPANG_FEE = "0.108"
LLM_PROVIDER = "gemini"
WING_VENDOR_ID = "A01818224"
WING_OUTBOUND_CODE = "25700124"
WING_RETURN_CODE = "1002747339"
WING_RETURN_CHARGE = "10000"
WING_REGISTERED_IP = "54.186.5.104"

# Optional server-side credentials (never put them in this file):
# npx wrangler secret put DOMEGGOOK_API_KEY
# npx wrangler secret put OWNERCLAN_USERNAME
# npx wrangler secret put OWNERCLAN_PASSWORD
# npx wrangler secret put WING_ACCESS_KEY
# npx wrangler secret put WING_SECRET_KEY
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put OPENAI_API_KEY
